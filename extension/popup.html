<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>FluxGet</title>
    <style>
      :root {
        --bg: #171a1f;
        --card: #1f232b;
        --border: #2c313a;
        --text: #e7eaf0;
        --dim: #9099a8;
        --accent: #4c8dff;
        --ok: #35c46a;
        --warn: #f0a840;
      }
      * { box-sizing: border-box; }
      body {
        width: 380px;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
      }
      .mark {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: linear-gradient(135deg, #4c8dff, #6f5cff);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 13px;
        color: #fff;
      }
      .title { font-size: 14px; font-weight: 600; }
      .status {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
        color: var(--dim);
      }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
      .dot.online { background: var(--ok); }
      .section { padding: 12px 16px; }
      .section h4 {
        margin: 0 0 8px;
        font-size: 12px;
        color: var(--dim);
        font-weight: 500;
        display: flex;
        justify-content: space-between;
      }
      .list {
        max-height: 190px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
      }
      .row:last-child { border-bottom: none; }
      .row .meta { min-width: 0; flex: 1; }
      .row .name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 12px;
      }
      .row .sub { font-size: 10.5px; color: var(--dim); }
      .empty {
        padding: 22px 12px;
        text-align: center;
        color: var(--dim);
        font-size: 12px;
      }
      .actions { display: flex; gap: 8px; padding: 0 16px 14px; }
      button {
        flex: 1;
        height: 30px;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        font-size: 12px;
        font-family: inherit;
      }
      .primary { background: linear-gradient(180deg, #4c8dff, #2f6ad9); color: #fff; }
      .ghost { background: var(--card); color: var(--dim); border: 1px solid var(--border); }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      footer {
        padding: 10px 16px 14px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11.5px;
        color: var(--dim);
      }
      footer a { color: var(--accent); text-decoration: none; cursor: pointer; }
      select {
        background: var(--card);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px 6px;
        font-size: 11px;
        max-width: 160px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="mark">FG</div>
      <div class="title">FluxGet 下载管理器</div>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">检测中…</span></div>
    </header>

    <div class="section">
      <h4>
        <span>本页侦测到的媒体资源</span>
        <span id="count">0 个</span>
      </h4>
      <div class="list" id="list">
        <div class="empty">正在扫描…</div>
      </div>
    </div>

    <div class="actions">
      <button class="primary" id="downloadAll" disabled>下载全部</button>
      <button class="ghost" id="downloadSelected" disabled>下载选中</button>
    </div>

    <footer>
      <span>接管下载 · <select id="intercept"><option value="on">开启</option><option value="off">关闭</option></select></span>
      <a id="openOptions">扩展设置</a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
