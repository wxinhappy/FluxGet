name: 构建失败诊断

# 主工作流彻底结束后才启动，此时日志必然可读
on:
  workflow_run:
    workflows: ["全平台发布构建"]
    types: [completed]

jobs:
  report:
    name: 抓取失败日志
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 抓取日志并建 issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          gh run view "$RUN_ID" --repo "$REPO" --log-failed > /tmp/ci.log 2>&1 || true
          wc -c /tmp/ci.log
          {
            echo "### 报错摘要"
            sed 's/\x1b\[[0-9;]*m//g' /tmp/ci.log \
              | grep -aiE "error|⨯|npm ERR|ELIFECYCLE|cannot|fatal|failed|not found|denied" \
              | cut -c1-300 | sort -u | head -60
            echo ""
            echo "### 每个任务最后 15 行"
            sed 's/\x1b\[[0-9;]*m//g' /tmp/ci.log | tail -40
          } > /tmp/ci-err.log
          wc -c /tmp/ci-err.log
          gh issue create --repo "$REPO" \
            --title "CI 构建失败 run-$RUN_ID" \
            --body-file /tmp/ci-err.log || echo "建 issue 失败"
